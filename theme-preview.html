<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ListAlert — Theme Preview</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #0a0a0a;
  color: #fff;
}

/* ── Section ─────────────────────────────────────────────── */
.theme-section {
  background: var(--bg);
  color: var(--text);
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(0,0,0,0.18);
}

/* ── Sticky label ─────────────────────────────────────────── */
.theme-label {
  position: sticky; top: 0; z-index: 50;
  background: #0a0a0a; color: #fff;
  padding: 10px 16px;
  font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
  border-bottom: 1px solid #1e1e1e;
  display: flex; align-items: center; gap: 10px;
}
.tl-num {
  background: #fff; color: #000;
  padding: 2px 7px; border-radius: 4px;
  font-size: 11px; font-weight: 700;
}
.tl-sub { opacity: 0.48; font-weight: 400; }
.tl-swatches { margin-left: auto; display: flex; gap: 4px; }
.tl-swatches span {
  width: 15px; height: 15px; border-radius: 3px;
  display: inline-block;
  border: 1px solid rgba(255,255,255,0.12);
  flex-shrink: 0;
}

/* ── Phone frame ──────────────────────────────────────────── */
.phone {
  max-width: 390px;
  margin: 16px auto 0;
  background: var(--bg);
  border: 1px solid var(--bg4);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
}
.screen-label {
  text-align: center;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
  color: var(--text3);
  margin: 16px 0 0;
  font-weight: 600;
}

/* ── App header ───────────────────────────────────────────── */
.app-header {
  background: var(--bg2);
  padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--bg4);
}
.wordmark { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.4px; }
.wordmark em { color: var(--amber); font-style: normal; }
.gps-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg3); color: var(--text2);
  padding: 5px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
}
.gps-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
}

/* ── Chips ────────────────────────────────────────────────── */
.chip-bar {
  display: flex; gap: 8px; padding: 12px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--bg4);
  overflow-x: auto; scrollbar-width: none;
}
.chip-bar::-webkit-scrollbar { display: none; }
.chip {
  background: var(--bg2); color: var(--text2);
  padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--bg4);
  white-space: nowrap; flex-shrink: 0;
}
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.store  { background: var(--bg3); color: var(--blue); border-color: var(--blue); }

/* ── List items ───────────────────────────────────────────── */
.list-body { padding: 8px 0 100px; min-height: 360px; }
.category {
  margin: 12px 16px 0;
  background: var(--bg2);
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--bg4);
}
.cat-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg3);
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--text2);
}
.cat-count { color: var(--text3); font-weight: 600; }
.item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-top: 1px solid var(--bg4);
}
.check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--text3); flex-shrink: 0;
}
.item-name { font-size: 15px; color: var(--text); font-weight: 500; flex: 1; }
.item-meta { font-size: 11px; color: var(--text3); }
.recurring {
  margin: 12px 16px 0;
  background: color-mix(in srgb, var(--amber) 10%, var(--bg2));
  border-radius: 12px; overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--amber) 38%, var(--bg4));
}
.rec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--amber);
}
.rec-badge {
  background: var(--amber); color: #fff;
  padding: 2px 7px; border-radius: 4px; font-size: 10px;
}
.recurring .item { border-top-color: color-mix(in srgb, var(--amber) 22%, var(--bg4)); }
.interval { font-size: 11px; color: var(--amber); font-weight: 600; }
.add-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
  background: var(--bg2);
  border-top: 1px solid var(--bg4);
}
.add-bar input {
  flex: 1; background: var(--bg3);
  border: 1px solid var(--bg4); border-radius: 10px;
  padding: 10px 12px; font-size: 14px; color: var(--text);
  font-family: inherit; outline: none;
}
.add-bar input::placeholder { color: var(--text3); }
.btn-add {
  background: var(--green); color: #fff;
  border: none; padding: 10px 18px; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
}

/* ── Cookbook ─────────────────────────────────────────────── */
.tab-bar {
  display: flex; background: var(--bg2);
  border-bottom: 1px solid var(--bg4);
}
.tab {
  flex: 1; text-align: center;
  padding: 14px 4px; font-size: 11px; font-weight: 600;
  color: var(--text3);
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--text); border-bottom-color: var(--amber); }
.recipe-list { padding: 12px 16px 80px; min-height: 300px; }
.recipe-card {
  background: var(--bg2); border: 1px solid var(--bg4);
  border-radius: 14px; padding: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
.recipe-thumb {
  width: 52px; height: 52px; border-radius: 10px;
  background: linear-gradient(135deg, var(--bg3), var(--bg4));
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.recipe-body { flex: 1; min-width: 0; }
.recipe-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.recipe-meta { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
.rc { background: color-mix(in srgb, var(--blue) 14%, var(--bg3)); color: var(--blue); padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.rc.wk { background: color-mix(in srgb, var(--amber) 16%, var(--bg3)); color: var(--amber); }
.btn-primary {
  display: block; width: calc(100% - 32px);
  margin: 0 16px 16px;
  background: var(--green); color: #fff;
  border: none; padding: 14px; border-radius: 14px;
  font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--green) 32%, transparent);
  cursor: pointer;
}

/* ── In-store ─────────────────────────────────────────────── */
.instore { background: var(--bg); min-height: 540px; display: flex; flex-direction: column; }
.is-head { background: var(--green); color: #fff; padding: 18px 18px 14px; text-align: center; }
.is-store { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
.is-count { font-size: 12px; opacity: 0.82; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.8px; }
.is-list { flex: 1; padding: 12px 0; }
.is-item { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--bg4); }
.is-check {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2.5px solid var(--text3); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: transparent;
}
.is-check.done { background: var(--green); border-color: var(--green); color: #fff; }
.is-name { font-size: 20px; font-weight: 600; color: var(--text); flex: 1; }
.is-item.done .is-name { text-decoration: line-through; color: var(--text3); }
.is-qty { font-size: 14px; color: var(--text2); font-weight: 500; }
.is-exit { width: 100%; margin: 0; background: var(--text); color: var(--bg2); border: none; padding: 18px; font-size: 16px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer; }

/* ── Intro & TOC ──────────────────────────────────────────── */
.intro { padding: 24px 20px 20px; background: #0a0a0a; text-align: center; border-bottom: 1px solid #1e1e1e; }
.intro h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
.intro h1 em { color: #C17B2A; font-style: normal; }
.intro p { margin: 0; font-size: 13px; color: #888; line-height: 1.5; }
#toc { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; max-width: 360px; margin: 14px auto 0; }
#toc a { background: #161616; color: #fff; padding: 9px 10px; border-radius: 7px; font-size: 12px; font-weight: 500; text-decoration: none; text-align: left; border: 1px solid #2a2a2a; display: flex; flex-direction: column; gap: 2px; }
#toc a .n { color: #555; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="intro">
  <h1>List<em>Alert</em> · Theme Preview</h1>
  <p>11 palettes × 3 screens · Scroll or jump below.</p>
  <div id="toc"></div>
</div>

<div id="app"></div>

<script>
/* ──────────────────────────────────────────────────────────────

   Order: 01 baseline → 02–04 kept (liked) → 05–11 new
────────────────────────────────────────────────────────────── */
const THEMES = [

  },
  {

    bg:'#FFFFFF', bg2:'#FFFFFF', bg3:'#F0F0F0', bg4:'#BFBFBF',

  },
  {

    text:'#F0F4FB', text2:'#B0C0D5', text3:'#7587A0',

  },
  {

    bg:'#FBF6F4', bg2:'#FFFFFF', bg3:'#F4ECE8', bg4:'#E6D9D2',
    text:'#2D2024', text2:'#75666B', text3:'#A89AA0',
    green:'#6FB68D', amber:'#D69970', blue:'#7FA0C2', red:'#D47883'
  },

  /* ── 7 new light themes ─────────────────────────────────── */
  {
    name: 'Sage & Stone', sub: 'botanical grey-greens',
    bg:'#EEF0EB', bg2:'#FAFBF8', bg3:'#E3E6DF', bg4:'#CFD3C8',
    text:'#1C2017', text2:'#5A6050', text3:'#8A9280',
    green:'#3D8A5C', amber:'#B07830', blue:'#4A7598', red:'#B84040'
  },
  {
    name: 'Golden Honey', sub: 'warm amber-forward, sunlit kitchen',
    bg:'#FDF5E4', bg2:'#FFFDF8', bg3:'#F6EDD3', bg4:'#E9DDB8',
    text:'#1F1504', text2:'#6A5028', text3:'#9E8050',
    green:'#3A8C52', amber:'#C47A10', blue:'#4A7EA8', red:'#B83C2A'
  },
  {
    name: 'Ocean Mist', sub: 'soft seafoam teal',
    bg:'#EEF5F7', bg2:'#FFFFFF', bg3:'#E0EDF1', bg4:'#C8DDE4',
    text:'#0E1E24', text2:'#446070', text3:'#7898A5',
    green:'#28967A', amber:'#B07840', blue:'#2D6E8E', red:'#B04040'
  },
  {
    name: 'Lavender Dusk', sub: 'muted purple-grey, calm + modern',
    bg:'#F2F0F8', bg2:'#FFFFFF', bg3:'#E8E5F4', bg4:'#D6D2EA',
    text:'#18142A', text2:'#524C72', text3:'#8880A8',
    green:'#4E8870', amber:'#A07835', blue:'#5862A8', red:'#B03860'
  },
  {
    name: 'Slate & Cloud', sub: 'cool blue-grey, clean + airy',
    bg:'#ECEEF4', bg2:'#FFFFFF', bg3:'#E0E4EE', bg4:'#CDD3E0',
    text:'#10162A', text2:'#48536A', text3:'#7880A0',
    green:'#2E8C6A', amber:'#9E7835', blue:'#3858A8', red:'#A83845'
  },
  {
    name: 'Warm Linen', sub: 'off-white parchment, cozy + tactile',
    bg:'#F8F4EE', bg2:'#FDFAF6', bg3:'#EDE8DE', bg4:'#DDD5C4',
    text:'#22190C', text2:'#6A5E4A', text3:'#9E9080',

  },
  {
    name: 'Forest Canopy', sub: 'deep greens on light, outdoorsy',
    bg:'#EFF4EF', bg2:'#FAFDF8', bg3:'#E0EBE0', bg4:'#CCDACC',
    text:'#0E1C0E', text2:'#446244', text3:'#729072',
    green:'#2A8040', amber:'#887A28', blue:'#3A6882', red:'#A83828'
  }
];

/* ──────────────────────────────────────────────────────────────
   SCREEN TEMPLATES
────────────────────────────────────────────────────────────── */
function screen1() {
  return `<div class="app-header">
  <div class="wordmark">List<em>Alert</em></div>
  <div class="gps-pill"><span class="gps-dot"></span>Near Whole Foods</div>
</div>
<div class="chip-bar">
  <div class="chip active">All</div>
  <div class="chip">Produce</div>
  <div class="chip">Dairy</div>
  <div class="chip store">+ Whole Foods</div>
</div>
<div class="list-body">
  <div class="category">
    <div class="cat-head"><span>▼ Produce</span><span class="cat-count">3 items</span></div>
    <div class="item"><div class="check"></div><div class="item-name">Honeycrisp apples</div><div class="item-meta">×4</div></div>
    <div class="item"><div class="check"></div><div class="item-name">Baby spinach</div><div class="item-meta">1 bag</div></div>
    <div class="item"><div class="check"></div><div class="item-name">Avocados</div><div class="item-meta">×2</div></div>
  </div>
  <div class="recurring">
    <div class="rec-head"><span>⟲ Recurring</span><span class="rec-badge">EVERY 7D</span></div>
    <div class="item"><div class="check"></div><div class="item-name">Whole milk</div><div class="interval">Due tomorrow</div></div>
  </div>
</div>
<div class="add-bar">
  <input placeholder="Add item…">
  <button class="btn-add">Add</button>
</div>`;
}

function screen2() {
  return `<div class="app-header">
  <div class="wordmark">List<em>Alert</em></div>
  <div class="gps-pill"><span class="gps-dot"></span>Home</div>
</div>
<div class="tab-bar">
  <div class="tab">List</div>
  <div class="tab active">My Cookbook</div>
  <div class="tab">Stores &amp; Household</div>
</div>
<div class="chip-bar">
  <div class="chip active">All</div>
  <div class="chip">Weeknight</div>
  <div class="chip">Quick</div>
</div>
<div class="recipe-list">
  <div class="recipe-card">
    <div class="recipe-thumb">🥬</div>
    <div class="recipe-body">
      <div class="recipe-name">Pesto Pasta</div>
      <div class="recipe-meta">8 ingredients · <span class="rc">Quick</span></div>
    </div>
  </div>
  <div class="recipe-card">
    <div class="recipe-thumb">🍛</div>
    <div class="recipe-body">
      <div class="recipe-name">Chicken Tikka Masala</div>
      <div class="recipe-meta">14 ingredients · <span class="rc wk">Weeknight</span></div>
    </div>
  </div>
</div>
<button class="btn-primary">✨ Extract / Inspire</button>`;
}

function screen3() {
  return `<div class="instore">
  <div class="is-head">
    <div class="is-store">Whole Foods · Park Slope</div>
    <div class="is-count">2 of 4 remaining</div>
  </div>
  <div class="is-list">
    <div class="is-item done"><div class="is-check done">✓</div><div class="is-name">Whole milk</div><div class="is-qty">1 gal</div></div>
    <div class="is-item"><div class="is-check"></div><div class="is-name">Sourdough bread</div><div class="is-qty">1 loaf</div></div>
    <div class="is-item done"><div class="is-check done">✓</div><div class="is-name">Free-range eggs</div><div class="is-qty">dozen</div></div>
    <div class="is-item"><div class="is-check"></div><div class="is-name">Avocados</div><div class="is-qty">×2</div></div>
  </div>
  <button class="is-exit">Done shopping</button>
</div>`;
}

/* ──────────────────────────────────────────────────────────────
   RENDER
────────────────────────────────────────────────────────────── */
const toc = document.getElementById('toc');
const app = document.getElementById('app');

THEMES.forEach((t, i) => {
  const n = String(i + 1).padStart(2, '0');

  // TOC entry
  const a = document.createElement('a');
  a.href = `#theme${i + 1}`;
  a.innerHTML = `<span class="n">${n}</span>${t.name}`;
  toc.appendChild(a);

  // CSS variable string
  const vars = [
    `--bg:${t.bg}`,`--bg2:${t.bg2}`,`--bg3:${t.bg3}`,`--bg4:${t.bg4}`,
    `--text:${t.text}`,`--text2:${t.text2}`,`--text3:${t.text3}`,
    `--green:${t.green}`,`--amber:${t.amber}`,`--blue:${t.blue}`,`--red:${t.red}`
  ].join(';');

  // Swatch dots
  const swatchColors = [t.bg, t.bg2, t.text, t.green, t.amber, t.blue, t.red];
  const swatches = swatchColors.map(c => `<span style="background:${c}"></span>`).join('');

  // Section
  const sec = document.createElement('section');
  sec.className = 'theme-section';
  sec.id = `theme${i + 1}`;
  sec.setAttribute('style', vars);

  sec.innerHTML = `
<div class="theme-label">
  <span class="tl-num">${n}</span>
  ${t.name}
  <span class="tl-sub">— ${t.sub}</span>
  <div class="tl-swatches">${swatches}</div>
</div>

<p class="screen-label">List View</p>
<div class="phone">${screen1()}</div>

<p class="screen-label">Cookbook</p>
<div class="phone">${screen2()}</div>

<p class="screen-label">In-Store Mode</p>
<div class="phone">${screen3()}</div>`;

  app.appendChild(sec);
});
</script>
</body>
</html>
